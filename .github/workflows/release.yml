name: Release packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.5"

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install native test dependencies (Linux)
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils python3

      - name: Install native test dependencies (macOS)
        if: matrix.target == 'macos-arm64'
        run: brew install poppler

      - name: Install native test dependencies (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: choco install poppler tesseract python --no-progress -y

      # Chocolatey shims and Poppler's Library/bin are not on PATH in the current
      # step after install; resolve the real executables and prepend them.
      - name: Resolve native tool paths (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $tools = @{}
          foreach ($name in 'pdfinfo', 'pdftoppm', 'tesseract', 'python') {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if (-not $command) {
              $pattern = switch ($name) { 'python' { 'python.exe' } default { "$name.exe" } }
              $hit = Get-ChildItem -Path 'C:\Program Files', "$env:ChocolateyInstall\lib", "$env:ProgramData\chocolatey\lib" -Recurse -Filter $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $command = Get-Item $hit.FullName }
            }
            if (-not $command) { throw "cannot resolve $name after choco install" }
            $tools[$name] = $command.Source ?? $command.FullName
            Write-Host "$name -> $($tools[$name])"
          }
          $binDirs = $tools.Values | ForEach-Object { Split-Path $_ } | Select-Object -Unique
          $env:PATH = (($binDirs -join ';') + ';' + $env:PATH)
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: bun install --frozen-lockfile

      - name: Typecheck, unit tests, and packaging tests
        if: matrix.target != 'windows-x64'
        shell: bash
        run: |
          bun run check
          bun test
          python3 -m unittest discover -s tests -p "package_test.py"

      # Native Windows tests cover portable input, configuration and PDF layout.
      # POSIX fake spoolers and PTYs are exercised by the Unix matrix jobs.
      - name: Typecheck, unit tests, and packaging tests (Windows)
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          bun run check
          bun test tests/
          python -m unittest discover -s tests -p "package_test.py"

      - name: Package (Linux)
        if: matrix.target == 'linux-x64'
        run: python3 scripts/package.py --target linux-x64

      - name: Package (macOS)
        if: matrix.target == 'macos-arm64'
        run: python3 scripts/package.py --target macos-arm64

      - name: Fetch verified SumatraPDF (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: ./windows/fetch-sumatra.ps1 -Destination dist/sumatra

      - name: Package (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: python scripts/package.py --target windows-x64 --sumatra dist/sumatra/SumatraPDF-3.6.1-64.exe

      - name: Verify packaged checksums
        run: |
          cd dist/release
          python3 -c 'import hashlib, pathlib, sys
          target = sys.argv[1]
          archives = sorted(pathlib.Path(".").glob(f"xprint-*-{target}.zip"))
          assert len(archives) == 1, archives
          archive = archives[0]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = dict(reversed(line.split()) for line in pathlib.Path("SHA256SUMS").read_text().splitlines())
          assert manifest[archive.name] == digest, (manifest[archive.name], digest)
          sidecar = pathlib.Path(str(archive) + ".sha256").read_text().split()
          assert sidecar == [digest, archive.name], sidecar
          print(f"ok {digest}  {archive.name}")' "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: xprint-${{ matrix.target }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Playback ${{ matrix.target }}
    needs: build
    # A failed build for another OS should not hide this platform's queue result.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xprint-${{ matrix.target }}
          path: downloaded

      - name: Install acceptance dependencies (macOS)
        if: matrix.target == 'macos-arm64'
        run: brew install poppler

      - name: Install acceptance dependencies (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: choco install poppler tesseract --no-progress -y

      - name: Verify downloaded checksums
        run: |
          cd downloaded
          python3 -c 'import hashlib, pathlib, sys
          target = sys.argv[1]
          archives = sorted(pathlib.Path(".").glob(f"xprint-*-{target}.zip"))
          assert len(archives) == 1, archives
          archive = archives[0]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = dict(reversed(line.split()) for line in pathlib.Path("SHA256SUMS").read_text().splitlines())
          assert manifest[archive.name] == digest, (manifest[archive.name], digest)
          print(f"ok {digest}  {archive.name}")' "${{ matrix.target }}"

      # The Windows acceptance script changes the default printer, which needs the
      # Print Spooler service and the Microsoft Print to PDF driver. Both are
      # expected on GitHub-hosted images; this step starts the service if it is
      # stopped and prints the real state so a missing prerequisite is a clear
      # provisioning error rather than an assertion inside acceptance.ps1.
      - name: Provision Print Spooler and Microsoft Print to PDF (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          Get-Service Spooler | Format-List Name, Status, StartType
          if ((Get-Service Spooler).Status -ne 'Running') {
            Set-Service Spooler -StartupType Automatic
            Start-Service Spooler
            (Get-Service Spooler).WaitForStatus('Running', '00:00:30')
          }
          Write-Host "Spooler: $((Get-Service Spooler).Status)"
          Get-PrinterDriver | Select-Object Name, Manufacturer | Format-Table
          if (-not (Get-PrinterDriver -Name 'Microsoft Print to PDF' -ErrorAction SilentlyContinue)) {
            throw 'Microsoft Print to PDF driver is not installed on this runner image; the Windows acceptance cannot create its temporary queues.'
          }

      # The host has no matching glob, so the archive name is resolved here and
      # passed explicitly. The container has no network at all; CUPS and the IPP
      # queue are both loopback inside it.
      - name: Linux loopback CUPS acceptance (offline container)
        if: matrix.target == 'linux-x64'
        run: |
          archive=$(ls downloaded/xprint-*-linux-x64.zip)
          docker build -t xprint-release-accept -f scripts/release/Dockerfile.linux scripts/release
          docker run --rm --network none --platform linux/amd64 \
            -v "$PWD/$archive:/work/package.zip:ro" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -v "$PWD/scripts/release:/scripts:ro" \
            -v "$PWD/evidence:/evidence" \
            xprint-release-accept \
            python3 /scripts/linux-accept.py /work/package.zip /fixtures/layout.cpp /evidence

      - name: macOS loopback CUPS acceptance (offline egress policy)
        if: matrix.target == 'macos-arm64'
        run: |
          archive=$(ls downloaded/xprint-*-macos-arm64.zip)
          python3 scripts/release/macos-accept.py "$archive" tests/fixtures/layout.cpp evidence

      # Reversible, runner-only rules: block outbound traffic for exactly the
      # two packaged executables. Removed in finally so the runner is left clean.
      - name: Windows Print-to-PDF acceptance (offline firewall)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'downloaded\xprint-*-windows-x64.zip' | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath playback
          $root = (Get-ChildItem 'playback\xprint-*-windows-x64' -Directory | Select-Object -First 1).FullName
          $xprint = Join-Path $root 'xprint.exe'
          $sumatra = Join-Path $root 'SumatraPDF-3.6.1-64.exe'
          $rulePrefix = 'xprint-acceptance-offline'
          $existing = @(Get-NetFirewallRule -DisplayName "$rulePrefix-*" -ErrorAction SilentlyContinue)
          if ($existing.Count) { $existing | Remove-NetFirewallRule }
          try {
            foreach ($exe in $xprint, $sumatra) {
              New-NetFirewallRule -DisplayName "$rulePrefix-$([System.IO.Path]::GetFileName($exe))" -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            }
            $tools = @{}
            foreach ($name in 'pdfinfo', 'pdftoppm', 'tesseract') {
              $command = Get-Command $name -ErrorAction SilentlyContinue
              if (-not $command) {
                $pattern = "$name.exe"
                $hit = Get-ChildItem -Path 'C:\Program Files', "$env:ChocolateyInstall\lib", "$env:ProgramData\chocolatey\lib" -Recurse -Filter $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $command = Get-Item $hit.FullName }
              }
              if (-not $command) { throw "cannot resolve $name; install poppler and tesseract first" }
              $tools[$name] = $command.Source ?? $command.FullName
            }
            $binDirs = $tools.Values | ForEach-Object { Split-Path $_ } | Select-Object -Unique
            $env:PATH = (($binDirs -join ';') + ';' + $env:PATH)
            ./windows/acceptance.ps1 -Xprint $xprint -WorkDir "$env:RUNNER_TEMP\xprint-acceptance"
          } finally {
            Get-NetFirewallRule -DisplayName "$rulePrefix-*" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xprint-${{ matrix.target }}-evidence
          path: |
            evidence/
            ${{ runner.temp }}/xprint-acceptance/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish verified archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xprint-{linux-x64,macos-arm64,windows-x64}
          # One directory per artifact keeps each target's own SHA256SUMS, so
          # they cannot overwrite one another before they have been checked.
          path: verified
          merge-multiple: false

      - name: Verify every archive, sidecar, and per-target manifest, then merge
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib, shutil, sys

          root = pathlib.Path("verified")
          merged = []
          seen = set()
          for artifact in sorted(root.iterdir()):
              if not artifact.is_dir():
                  sys.exit(f"unexpected file outside an artifact directory: {artifact}")
              archives = sorted(artifact.glob("xprint-*.zip"))
              if not archives:
                  sys.exit(f"{artifact} contains no release archive")
              manifest = dict(reversed(line.split()) for line in (artifact / "SHA256SUMS").read_text().splitlines())
              for archive in archives:
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  sidecar = pathlib.Path(str(archive) + ".sha256").read_text().split()
                  if sidecar != [digest, archive.name]:
                      sys.exit(f"{archive}: sidecar {sidecar} does not match {digest}")
                  if manifest.get(archive.name) != digest:
                      sys.exit(f"{archive}: manifest lists {manifest.get(archive.name)}, actual {digest}")
                  if archive.name in seen:
                      sys.exit(f"duplicate archive {archive.name}")
                  seen.add(archive.name)
                  merged.append(f"{digest}  {archive.name}\n")
                  print(f"ok {digest}  {archive.name}")
          # Every target must be present exactly once; evidence artifacts are
          # never downloaded because the pattern above matches their names only
          # with an exact "-<target>" suffix.
          targets = ("linux-x64", "macos-arm64", "windows-x64")
          missing = [target for target in targets if not any(name.endswith(f"-{target}.zip") for name in seen)]
          if missing or len(seen) != len(targets):
              sys.exit(f"missing {missing}; expected one archive per target, found {sorted(seen)}")
          (root / "SHA256SUMS").write_text("".join(sorted(merged, key=lambda line: line.split()[1])))
          for artifact in root.iterdir():
              if artifact.is_dir():
                  for path in [*artifact.glob("xprint-*.zip"), *artifact.glob("xprint-*.zip.sha256")]:
                      shutil.move(str(path), root / path.name)
                  # The per-target manifest was checked above and is replaced by
                  # the merged one; nothing else may be published unchecked.
                  leftovers = [path.name for path in artifact.iterdir() if path.name != "SHA256SUMS"]
                  if leftovers:
                      sys.exit(f"{artifact} still contains unchecked files: {leftovers}")
                  shutil.rmtree(artifact)
          print("merged SHA256SUMS:")
          print((root / "SHA256SUMS").read_text(), end="")
          EOF
          ls -la verified

      - uses: actions/upload-artifact@v4
        with:
          name: xprint-release-${{ github.ref_name }}
          path: verified/
          if-no-files-found: error
          retention-days: 90

      - name: Attach to tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            verified/xprint-*.zip verified/*.zip.sha256 verified/SHA256SUMS
